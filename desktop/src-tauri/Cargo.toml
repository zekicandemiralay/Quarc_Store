[package]
name = "quarc-store"
version = "0.1.0"
description = "Quarc Store for Windows: installs, updates and opens the Quarc desktop apps"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# A second launch of the Store focuses the window that is already open.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Downloads the installers (rustls, so it does not depend on the system's TLS stack).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
# cookie 0.18.1 uses the old 1-arg parse() API; time 0.3.52 changed it to 2 args.
# Pin below the break until Tauri pulls in a fixed cookie version.
time = { version = ">=0.3, <0.3.52" }

[target.'cfg(windows)'.dependencies]
# "What is installed": Windows lists every installed program in the registry.
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
