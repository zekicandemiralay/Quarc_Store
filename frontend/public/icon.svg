<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Badge: vivid diagonal gradient, like the other Quarc icons -->
    <linearGradient id="bg" x1="0.15" y1="0.08" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#3fe28f"/>
      <stop offset="0.45" stop-color="#10b981"/>
      <stop offset="1" stop-color="#067780"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Glossy white glyph -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf3"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#d9e2ea"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ec"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#04493f" flood-opacity="0.38"/>
    </filter>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>

    <!-- The four app tiles: the Quarc apps' own colours -->
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb5ff"/><stop offset="1" stop-color="#3a62f0"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a45"/><stop offset="1" stop-color="#e3256b"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa0"/><stop offset="1" stop-color="#6d3df2"/></linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="512" cy="512" r="478" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="478" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="466" fill="none" stroke="url(#rim)" stroke-width="20"/>

  <g transform="translate(512 548) scale(1.17) translate(-512 -548)">
  <!-- Bag -->
  <g filter="url(#shadow)">
    <!-- thickness -->
    <rect x="286" y="384" width="452" height="420" rx="62" fill="#c3d0db"/>
    <!-- body -->
    <rect x="286" y="372" width="452" height="420" rx="62" fill="url(#paper)"/>
    <!-- top fold -->
    <path d="M286 434 V434 A62 62 0 0 1 348 372 H676 A62 62 0 0 1 738 434 V452 H286 Z" fill="url(#band)"/>
    <!-- handle holes -->
    <circle cx="428" cy="418" r="17" fill="#9fb0c0"/>
    <circle cx="596" cy="418" r="17" fill="#9fb0c0"/>
    <!-- handle -->
    <path d="M428 418 V326 A84 84 0 0 1 596 326 V418" fill="none" stroke="url(#handle)" stroke-width="40" stroke-linecap="round"/>
  </g>

  <!-- App tiles on the bag -->
  <g filter="url(#tileShadow)">
    <rect x="404" y="508" width="98" height="98" rx="26" fill="url(#t1)"/>
    <rect x="522" y="508" width="98" height="98" rx="26" fill="url(#t2)"/>
    <rect x="404" y="626" width="98" height="98" rx="26" fill="url(#t3)"/>
    <rect x="522" y="626" width="98" height="98" rx="26" fill="url(#t4)"/>
  </g>
  <!-- tile gloss -->
  <g fill="#ffffff" opacity="0.16">
    <rect x="414" y="516" width="78" height="34" rx="16"/>
    <rect x="532" y="516" width="78" height="34" rx="16"/>
    <rect x="414" y="634" width="78" height="34" rx="16"/>
    <rect x="532" y="634" width="78" height="34" rx="16"/>
  </g>
  </g>
</svg>
