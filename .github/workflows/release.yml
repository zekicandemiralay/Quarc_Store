name: Release

# Push a tag like v1.1.0 to build the signed Quarc Store APK (Android), the
# Windows installer and the Mac disk images, and publish them as one GitHub
# release. The Store lists itself in its own catalog, so every installed Store
# (Android, Windows and Mac) sees the new version and can update itself.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const isTag = context.ref.startsWith('refs/tags/');
            const tag = isTag ? context.ref.replace('refs/tags/', '') : `manual-${Date.now()}`;
            const body = [
              '## Installation',
              '',
              '| Platform | File |',
              '|----------|------|',
              '| Android  | `Quarc-Store-Android.apk` |',
              '| Windows  | `Quarc.Store_*_x64-setup.exe` |',
              '| Mac (Apple silicon: M1 and later) | `Quarc.Store_*_aarch64.dmg` |',
              '| Mac (Intel) | `Quarc.Store_*_x64.dmg` |',
              '',
              '**Android:** download the APK, allow your browser/file manager to install apps, and open it.',
              '**Windows:** run the installer. If Windows says "protected your PC", choose More info → Run anyway (the Quarc apps are not signed with a paid certificate).',
              '**Mac:** open the .dmg and drag Quarc Store to Applications, then open it from Applications. The first time, the Mac says it can\'t check the app (it is not signed with a paid Apple certificate): click Done, open System Settings → Privacy & Security, scroll down and click Open Anyway. Apps installed by Quarc Store open without that question.',
              'Already have Quarc Store? It will offer this update by itself.',
              '',
              'Tailscale must be connected — see README_Users.md.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Quarc Store ${tag}`,
              body,
              draft: true,
              prerelease: !isTag,
            });
            return data.id;

  build-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build the Store pages (bundled into the app, pointing at the server)
        working-directory: frontend
        env:
          VITE_API_URL: https://quarcnet0.tail84500c.ts.net:4006
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Set desktop version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('tauri.conf.json','utf8'));c.version='${TAG}';fs.writeFileSync('tauri.conf.json',JSON.stringify(c,null,2)+'\n')"

      - name: Build and upload the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}

  build-macos:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            rust-target: aarch64-apple-darwin
          - label: Intel
            rust-target: x86_64-apple-darwin
    name: build-macos (${{ matrix.label }})
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # On a Mac the window loads the Store page from the server (tauri.macos.conf.json); the bundled pages
      # are still built because Tauri needs them to compile.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build the Store pages
        working-directory: frontend
        env:
          VITE_API_URL: https://quarcnet0.tail84500c.ts.net:4006
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Set desktop version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('tauri.conf.json','utf8'));c.version='${TAG}';fs.writeFileSync('tauri.conf.json',JSON.stringify(c,null,2)+'\n')"

      - name: Build and upload the disk image (ad-hoc signed)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.rust-target }}

  build-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend for Android (bundled, points to server)
        working-directory: frontend
        env:
          VITE_API_URL: https://quarcnet0.tail84500c.ts.net:4006
        run: npm run build

      - name: Copy frontend build into Capacitor web dir
        run: cp -r frontend/dist/* mobile/www/

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mobile/android
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          # MAJOR*10000 + MINOR*100 + PATCH, so versionCode always grows
          # (needs MINOR and PATCH to stay under 100).
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          CODE=$((MAJOR * 10000 + MINOR * 100 + ${PATCH:-0}))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$TAG\"/" app/build.gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      - name: Verify keystore, alias and password
        working-directory: mobile/android/app
        run: |
          if [ ! -s release.keystore ]; then echo "::error::KEYSTORE_BASE64 secret is missing or empty"; exit 1; fi
          keytool -list -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias quarc-store \
            || { echo "::error::Keystore could not be opened: wrong KEYSTORE_PASSWORD, bad KEYSTORE_BASE64, or no key with alias quarc-store"; exit 1; }

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: quarc-store
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload the APK to the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              name: 'Quarc-Store-Android.apk',
              data: fs.readFileSync('mobile/android/app/build/outputs/apk/release/app-release.apk'),
            });

  publish-release:
    needs: [create-release, build-windows, build-macos, build-android]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              draft: false,
            });
